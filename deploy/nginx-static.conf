# Include inside the WorkTV server block. Public assets only; API/session responses stay on the app.
location ^~ /static/ {
    root /opt/flix/Streaming;
    try_files $uri =404;
    # Keep HTML under Flask's dynamic CSP (including configured embedded players).
    location ~ \.html$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    sendfile on;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
